<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Moisés Andrade</title>
  <desc id="desc">Minimal dark developer banner with subtle technical grid and typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#9bb4cc" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <path d="M870 0 L1200 0 L1200 330 L1040 330 Z" fill="#58a6ff" opacity=".035"/>
  <path d="M64 66 H126" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="64" y="148" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8">Moisés Andrade</text>
  <text x="66" y="194" fill="#9fb3c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="2.4">SOFTWARE · SYSTEMS · PRACTICAL PROBLEM SOLVING</text>
  <text x="66" y="254" fill="#c9d1d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Building useful things. Understanding how things work.</text>
  <g transform="translate(1012 166)" fill="none" stroke="#58a6ff" stroke-width="2" opacity=".72">
    <circle r="66" stroke-opacity=".22"/>
    <circle r="47" stroke-opacity=".42"/>
    <path d="M-28 0 H28 M0 -28 V28 M-20 -20 L20 20 M20 -20 L-20 20" stroke-opacity=".55"/>
    <circle r="8" fill="#58a6ff" stroke="none"/>
  </g>
  <text x="1136" y="294" text-anchor="end" fill="#6e8298" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">BUILD / EXPLORE / IMPROVE</text>
